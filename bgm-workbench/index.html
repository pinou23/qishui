<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BGM 工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>BGM 工作台</h1>
          <div class="subline" id="libraryMeta">正在读取音乐库</div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="importOverridesButton" title="导入人工标注" aria-label="导入人工标注">
            ⇧
          </button>
          <button class="icon-button" id="exportOverridesButton" title="导出人工标注" aria-label="导出人工标注">
            ⇩
          </button>
          <button class="secondary-button" id="exportButton">导出完整库</button>
          <button class="primary-button" id="saveButton">保存</button>
          <input id="importOverridesInput" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="stats-row" id="statsRow"></section>

      <section class="filterbar">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="歌名 / 歌手 / 标签 / 备注" />
        </label>
        <label>
          <span>复核</span>
          <select id="reviewFilter"></select>
        </label>
        <label>
          <span>试听</span>
          <select id="listenFilter"></select>
        </label>
        <label>
          <span>类型</span>
          <select id="mediaFilter"></select>
        </label>
        <label class="toggle-line">
          <input id="favoriteFilter" type="checkbox" />
          <span>常用</span>
        </label>
      </section>

      <section class="tag-filters" id="tagFilters"></section>

      <main class="workspace">
        <section class="library-pane">
          <div class="pane-head">
            <strong id="resultCount">0 首</strong>
            <div class="sort-group">
              <button class="small-button active" data-sort="priority">优先级</button>
              <button class="small-button" data-sort="order">收藏序</button>
              <button class="small-button" data-sort="confidence">置信度</button>
            </div>
          </div>
          <div class="track-table" id="trackList"></div>
        </section>

        <aside class="detail-pane" id="detailPane">
          <div class="empty-state">选择一首音乐</div>
        </aside>
      </main>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
